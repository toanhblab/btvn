<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 8px 0 0 rgba(0,0,0,0.1);
        }
        .chunky-shadow:active {
            box-shadow: 0 0 0 0 rgba(0,0,0,0.1);
            transform: translateY(8px);
        }
        
        .soft-card-shadow {
            box-shadow: 0 8px 20px 0 rgba(0, 0, 0, 0.05);
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md select-none">
<!-- TopAppBar (Transactional - Hidden Navigation Shell, Only Back Button) -->
<header class="flex justify-between items-center w-full px-margin-edge py-6 bg-transparent sticky top-0 z-10">
<button class="w-[64px] h-[64px] flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:scale-105 active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<!-- Progress Bar -->
<div class="w-1/2 max-w-md h-6 bg-surface-container-high rounded-full overflow-hidden flex items-center">
<div class="h-full bg-secondary-container w-2/3 rounded-full transition-all duration-500 ease-in-out relative">
<span class="material-symbols-outlined absolute right-1 top-1/2 -translate-y-1/2 text-tertiary-fixed text-sm" data-icon="star" data-weight="fill">star</span>
</div>
</div>
</div>
<!-- Spacer for centering -->
<div class="w-[64px]"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-edge py-gutter max-w-6xl mx-auto w-full relative z-0">
<!-- Instruction Text -->
<h1 class="font-display-hero text-display-hero text-on-surface mb-stack-gap text-center">Bé hãy chọn hình đúng nhé!</h1>
<!-- Activity Area: Bento-style selection cards -->
<div class="grid grid-cols-2 gap-gutter w-full max-w-4xl mb-stack-gap">
<!-- Option Card 1 -->
<div class="bg-surface-container-lowest rounded-card soft-card-shadow p-6 flex flex-col items-center justify-center cursor-pointer transition-transform hover:-translate-y-2 active:translate-y-0 border-4 border-transparent hover:border-primary-fixed-dim relative group h-[300px]">
<img class="w-48 h-48 object-contain mb-4 pointer-events-none" data-alt="A brightly colored, high-contrast, stylized illustration of a happy cartoon cat sitting. The style is 2D vector art with thick outlines, designed for young children. Soft neomorphism style lighting, warm cream background (#FFF8F0). Playful and inviting mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDi5ovbjiOM-NrRZiJGoE0kjygtIZsi-VnKP4soD0QOP-h2kab8klkiCyGrTXo39qjQ7o00fjbu2viySREAZckCowD0mXI1sScCkY7EY5SM6dm8tcx0lvoCjU9JPSI3BuW5__JtAgh6IFZ9g4p9WUQL9ObXgKRRPTD0p4EesjKbUVLnHM8Jpub9csk1JlmOPrYTVp95rph-X-Cqo2I96cMVnJj1PYQTzCknXbY1o6bOuZkOXj-NGOhz"/>
<div class="absolute top-4 right-4 opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-success-green text-5xl" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</div>
<!-- Option Card 2 -->
<div class="bg-surface-container-lowest rounded-card soft-card-shadow p-6 flex flex-col items-center justify-center cursor-pointer transition-transform hover:-translate-y-2 active:translate-y-0 border-4 border-transparent hover:border-primary-fixed-dim relative group h-[300px] selected">
<img class="w-48 h-48 object-contain mb-4 pointer-events-none" data-alt="A brightly colored, high-contrast, stylized illustration of a playful cartoon dog jumping. The style is 2D vector art with thick outlines, designed for young children. Soft neomorphism style lighting, warm cream background (#FFF8F0). Playful and inviting mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEDrP0o84OfRPJdL2svSyHws__RWJDCsZXzRvsbK2n0uWyl8hm8QJwTEyUeLVqDMnactUA1CzT-IBFvnGSHaqHTRu54hfSQ11jKY7EZh2wN2-sDar8VlcDQxjhqDN3MS6d7D4LQ4SpfSsukCsEMd0W0qoD3QwxrLq9_X7mhdK7xM25H_d1Yk-yvYG4NDiur4k4RHFkqKSn1FuuAB3m2oPf60mbaIpJ8xAxRblve2FdsNUUU41oYNYh"/>
<div class="absolute top-4 right-4 opacity-100 transition-opacity">
<span class="material-symbols-outlined text-success-green text-5xl" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="w-full px-margin-edge pb-margin-edge flex justify-center sticky bottom-0 z-10 bg-gradient-to-t from-background via-background to-transparent pt-8">
<button class="bg-[#22C55E] hover:bg-[#16a34a] text-white font-headline-lg text-headline-lg rounded-[24px] px-16 py-6 min-h-[64px] min-w-[300px] flex items-center justify-center chunky-shadow transition-all border-b-[6px] border-[#16a34a]">
            Xong
        </button>
</div>
<!-- Script for simple interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.rounded-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected state from all
                    cards.forEach(c => {
                        c.classList.remove('selected', 'border-primary');
                        c.classList.add('border-transparent');
                        const check = c.querySelector('.opacity-100');
                        if(check) {
                            check.classList.replace('opacity-100', 'opacity-0');
                        }
                    });
                    
                    // Add selected state to clicked
                    card.classList.add('selected', 'border-primary');
                    card.classList.remove('border-transparent');
                    const check = card.querySelector('.opacity-0');
                    if(check) {
                         check.classList.replace('opacity-0', 'opacity-100');
                    }
                });
            });
            
            // Initialize the pre-selected card styling
            const preSelected = document.querySelector('.selected');
            if(preSelected) {
                preSelected.classList.add('border-primary');
                preSelected.classList.remove('border-transparent');
            }
        });
    </script>
</body></html>
