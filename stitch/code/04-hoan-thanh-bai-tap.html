<!-- Simple Confetti Script -->
<script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const confetti = [];
        const confettiCount = 150;
        // Theme colors adapted for canvas
        const colors = ['#0058be', '#fd761a', '#eec200', '#ba1a1a', '#ffb690', '#adc6ff'];

        for (let i = 0; i < confettiCount; i++) {
            confetti.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 15 + 10,
                h: Math.random() * 15 + 10,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 3 + 2,
                speedX: Math.random() * 2 - 1,
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 5 - 2.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confetti.forEach((c) => {
                c.y += c.speedY;
                c.x += c.speedX;
                c.rot += c.rotSpeed;

                if (c.y > canvas.height) {
                    c.y = -20;
                    c.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.translate(c.x + c.w / 2, c.y + c.h / 2);
                ctx.rotate((c.rot * Math.PI) / 180);
                ctx.fillStyle = c.color;
                // Draw rounded rects for a softer, "chunky" look
                ctx.beginPath();
                ctx.roundRect(-c.w / 2, -c.h / 2, c.w, c.h, 4);
                ctx.fill();
                ctx.restore();
            });
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
