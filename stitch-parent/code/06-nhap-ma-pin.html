<script>
        // Simple script to handle PIN input interaction
        document.addEventListener('DOMContentLoaded', () => {
            const pinBoxes = document.querySelectorAll('.gap-4 > div');
            const keys = document.querySelectorAll('.grid button');
            let currentPin = '1'; // Simulate one digit entered
            
            function updateDisplay() {
                pinBoxes.forEach((box, index) => {
                    if (index < currentPin.length) {
                        box.classList.add('border-primary');
                        box.classList.remove('border-outline-variant');
                        box.innerHTML = '<div class="w-3 h-3 bg-primary rounded-full"></div>';
                    } else if (index === currentPin.length) {
                        box.classList.add('border-primary');
                        box.classList.remove('border-outline-variant');
                        box.innerHTML = '';
                    } else {
                        box.classList.remove('border-primary');
                        box.classList.add('border-outline-variant');
                        box.innerHTML = '';
                    }
                });
            }

            keys.forEach(key => {
                key.addEventListener('click', () => {
                    const value = key.textContent.trim();
                    const icon = key.querySelector('.material-symbols-outlined');
                    
                    if (icon && icon.getAttribute('data-icon') === 'backspace') {
                        if (currentPin.length > 0) {
                            currentPin = currentPin.slice(0, -1);
                        }
                    } else if (value && currentPin.length < 4) {
                        currentPin += value;
                        // In a real app, check PIN if length is 4
                    }
                    updateDisplay();
                });
            });
            
            // Initial call to set state based on default HTML
            updateDisplay();
        });
    </script>
