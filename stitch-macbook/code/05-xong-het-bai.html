<style>
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 24px;
            background: #f00;
            border-radius: 4px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .trophy-glow {
            box-shadow: 0 0 80px 20px rgba(251, 120, 0, 0.4);
        }
        .chunky-button {
            border-bottom-width: 6px;
            border-bottom-color: #004494; /* on-primary-fixed-variant approx */
            transition: transform 0.1s, border-width 0.1s;
        }
        .chunky-button:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="bg-[#FFF8F0] min-h-screen w-full flex items-center justify-center overflow-hidden font-display-lg relative">
<!-- Confetti Background (Simulated with simple shapes) -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Floating Stars -->
<svg class="absolute top-12 left-12 md:top-24 md:left-24 w-32 h-32 md:w-48 md:h-48 text-tertiary-fixed-dim opacity-40 z-0 animate-pulse" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
</svg>
<svg class="absolute bottom-12 right-12 md:bottom-24 md:right-24 w-40 h-40 md:w-64 md:h-64 text-tertiary-fixed-dim opacity-30 z-0 animate-pulse" fill="currentColor" style="animation-delay: 1s;" viewbox="0 0 24 24">
<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
</svg>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center text-center p-gutter max-w-4xl w-full">
<!-- Trophy Centerpiece -->
<div class="relative w-[240px] h-[240px] mb-stack-lg rounded-full bg-surface-container-highest trophy-glow flex items-center justify-center p-4">
<img alt="" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp0sMNl8S_ibCwaXpA9zbdxFmOGjgpalwxZXD_RRvGkl-dmHWP8gJVz20ew-2tLomOxSCSpiLlTk_V12Dyb0Uk-E4kdtsuY8VRrNm_J9dSppT9f6DPrvW5EmxVyRCr33NxszFdiybv1vLWM8lKQkAaN_Bd0bxpgjCH522FtQhohZeTFqezIaXwYX8WrRKZ1p6ia-QI8kjOB2pau6qbMhvbmzdWAIax9Z0vrvybxp8PjtL2P7KoGlQHAsx66DavQF8EdHsK0bJh0o8"/>
</div>
<!-- Text Content -->
<h1 class="font-display-lg text-display-lg text-primary mb-stack-sm drop-shadow-sm">
            Giỏi quá Minh!
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg max-w-lg">
            Con làm hết bài hôm nay rồi. Đi chơi thôi!
        </p>
<!-- Action Button -->
<button class="chunky-button bg-primary text-on-primary font-label-lg text-label-lg rounded-full h-[80px] w-[280px] flex items-center justify-center gap-2 hover:bg-primary-container focus:outline-none focus:ring-4 focus:ring-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
            Quay lại
        </button>
</main>
<script>
        // Simple Confetti Generator
        const colors = ['#0c70ea', '#fb7800', '#f5bf00', '#4caf50']; // primary, secondary, tertiary, green
        const container = document.getElementById('confetti-container');
        
        for(let i=0; i<50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti-piece');
            
            // Randomize properties
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 5) + 's';
            
            // Randomize shapes (squares vs rectangles)
            if(Math.random() > 0.5) {
                confetti.style.width = '12px';
                confetti.style.height = '12px';
                confetti.style.borderRadius = '50%';
            }
            
            container.appendChild(confetti);
        }
    </script>
